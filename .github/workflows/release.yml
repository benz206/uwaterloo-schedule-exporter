name: Release

on:
  push:
    branches: [master]
    paths: [manifest.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package extension
        if: steps.tag.outputs.exists == 'false'
        run: zip "uwaterloo-schedule-exporter-v${{ steps.version.outputs.version }}.zip" manifest.json main.js dnr-rules.json icon.png LICENSE

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: uwaterloo-schedule-exporter-v${{ steps.version.outputs.version }}.zip
